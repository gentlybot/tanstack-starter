# gently workspace runtime config.
# Declares the toolchain, the Postgres service, and the three processes
# (web + websocket server + background worker) that make up this app.

tools:
  - nodejs_22

# Shared env for setup + every app process.
env:
  # Signs better-auth session tokens. Sandbox-internal value; use a real
  # secret (openssl rand -base64 32) for anything public-facing.
  BETTER_AUTH_SECRET: gently-sandbox-dev-secret-0123456789abcdef

# Runs once per workspace before apps start (repo root). Must stay idempotent —
# it reruns on every rebuild/wake.
setup:
  - npm install
  - npm run db:migrate
  - npm run db:seed

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # Injected into the shell env for setup/startup — the app reads
    # DATABASE_URL and never hardcodes connection details.
    connectionEnv:
      DATABASE_URL: postgres://app:app@postgres:5432/app
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 15

apps:
  web:
    port: 3000
    routes:
      - path: /
    startup:
      - npm run dev

  # The realtime WebSocket server. The web app's Vite dev server proxies /ws
  # here (vite.config.ts), so clients always connect same-origin — no route
  # needed. Health: GET / on :3001 returns 200.
  ws:
    port: 3001
    startup:
      - npm run ws

  # Port-less app = long-running background process (the pg-boss worker).
  worker:
    startup:
      - npm run worker
