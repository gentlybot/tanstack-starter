# gently workspace runtime config.
# Declares the toolchain, the Postgres service, and the two processes
# (web + background worker) that make up this app.

tools:
  - nodejs_22

# Runs once per workspace before apps start (repo root).
setup:
  - npm install
  - npm run db:push

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # Injected into the shell env for setup/startup — the app reads
    # DATABASE_URL and never hardcodes connection details.
    connectionEnv:
      DATABASE_URL: postgres://app:app@postgres:5432/app
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 15

apps:
  web:
    port: 3000
    routes:
      - path: /
    startup:
      - npm run dev

  # Port-less app = long-running background process (pg-boss worker).
  worker:
    startup:
      - npm run worker
